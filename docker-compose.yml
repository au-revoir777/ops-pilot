# =============================================================================
# OpsPilot â€” Docker Compose (Local Development)
# =============================================================================
# Start: docker compose up -d --build
# Stop:  docker compose down -v
# =============================================================================

# Fixed project name: Alloy selects this project's containers by it.
name: opspilot

services:
  # -------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # -------------------------------------------------------------------------
  # Pinned image (pgvector 0.8.0 on PostgreSQL 16): reproducible builds and the
  # same extension version locally, in CI and in tests. See DECISIONS.md D-017.
  # The port is bound to 127.0.0.1 for local tooling only; in the cloud
  # architecture the database sits in private subnets and is never published.
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Disposable database for integration tests (profile "test"): tmpfs storage,
  # so every container start is a clean, empty database.
  #   docker compose --profile test up -d postgres-test
  postgres-test:
    profiles: ["test"]
    image: pgvector/pgvector:0.8.0-pg16
    container_name: opspilot-postgres-test
    environment:
      POSTGRES_USER: opspilot_test
      POSTGRES_PASSWORD: opspilot_test
      POSTGRES_DB: opspilot_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_test -d opspilot_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  # -------------------------------------------------------------------------
  # Schema migrations (one-shot): the API starts only after this succeeds.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: opspilot-api:local
    container_name: opspilot-migrate
    init: true  # reap child processes; clean stop on SIGTERM
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-opspilot_dev}@postgres:5432/${POSTGRES_DB:-opspilot}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------------
  # OpsPilot API
  # -------------------------------------------------------------------------
  api:
    image: opspilot-api:local
    container_name: opspilot-api
    init: true  # reap child processes; clean stop on SIGTERM
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-opspilot_dev}@postgres:5432/${POSTGRES_DB:-opspilot}
      MCP_SERVER_URL: http://mcp:8001
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      RAG_DOCS_PATH: /app/knowledge
    volumes:
      # Knowledge base for RAG; ingest with: docker compose exec api python -m app.rag.ingest
      - ./docs/knowledge:/app/knowledge:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - default
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # MCP Server
  # -------------------------------------------------------------------------
  # Read-only operational tools for the agent (Model Context Protocol).
  # No .env file: the server only gets the settings it needs (least privilege).
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: opspilot-mcp:local
    container_name: opspilot-mcp
    init: true  # reap child processes; clean stop on SIGTERM
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      API_URL: http://api:8000
      CATALOG_PATH: /etc/opspilot/services.yml
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./observability/catalog/services.yml:/etc/opspilot/services.yml:ro
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Demo Workloads
  # -------------------------------------------------------------------------
  # One image (./workloads) runs all three services; the command picks which.
  # Failure injection is OFF unless ENABLE_FAILURE_INJECTION=true is set for a
  # controlled demo. Ports are published on 127.0.0.1 only.
  #   Inject:  curl -X POST localhost:8080/admin/failure -d '{"mode":"db"}' -H 'content-type: application/json'
  checkout:
    build:
      context: ./workloads
    image: opspilot-workloads:local
    container_name: opspilot-checkout
    init: true  # reap child processes; clean stop on SIGTERM
    command: ["uvicorn", "opsdemo.checkout:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    environment: &workload-env
      SERVICE_NAME: checkout
      SERVICE_VERSION: ${CHECKOUT_VERSION:-1.8.2}
      SERVICE_PORT: "8080"
      USERS_URL: http://users:8082
      PAYMENTS_URL: http://payments:8081
      ENABLE_FAILURE_INJECTION: ${ENABLE_FAILURE_INJECTION:-false}
      FAILURE_MODE: ${CHECKOUT_FAILURE_MODE:-none}
      FAILURE_SEED: ${FAILURE_SEED:-}
      FAILURE_ADMIN_TOKEN: ${FAILURE_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${CHECKOUT_PORT:-8080}:8080"
    depends_on:
      users:
        condition: service_healthy
      payments:
        condition: service_healthy
    restart: unless-stopped

  payments:
    build:
      context: ./workloads
    image: opspilot-workloads:local
    container_name: opspilot-payments
    init: true  # reap child processes; clean stop on SIGTERM
    command: ["uvicorn", "opsdemo.payments:app", "--host", "0.0.0.0", "--port", "8081", "--no-access-log"]
    environment:
      <<: *workload-env
      SERVICE_NAME: payments
      SERVICE_VERSION: ${PAYMENTS_VERSION:-2.1.0}
      SERVICE_PORT: "8081"
      FAILURE_MODE: ${PAYMENTS_FAILURE_MODE:-none}
    ports:
      - "127.0.0.1:${PAYMENTS_PORT:-8081}:8081"
    restart: unless-stopped

  users:
    build:
      context: ./workloads
    image: opspilot-workloads:local
    container_name: opspilot-users
    init: true  # reap child processes; clean stop on SIGTERM
    command: ["uvicorn", "opsdemo.users:app", "--host", "0.0.0.0", "--port", "8082", "--no-access-log"]
    environment:
      <<: *workload-env
      SERVICE_NAME: users
      SERVICE_VERSION: ${USERS_VERSION:-1.3.0}
      SERVICE_PORT: "8082"
      FAILURE_MODE: ${USERS_FAILURE_MODE:-none}
    ports:
      - "127.0.0.1:${USERS_PORT:-8082}:8082"
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Observability
  # -------------------------------------------------------------------------
  # Metrics. Rules in observability/prometheus/rules (RED recording rules + alerts).
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: opspilot-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./observability/prometheus/targets:/etc/prometheus/targets:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Logs: Loki stores them, Alloy collects container stdout and parses our JSON.
  loki:
    image: grafana/loki:3.2.0
    container_name: opspilot-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: opspilot-alloy
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to discover containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: opspilot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/opspilot-services.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Frontend (Next.js)
  # -------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: opspilot-web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3001:3000"
    depends_on:
      - api
    restart: unless-stopped

networks:
  # Database traffic only. Postgres is attached to nothing else.
  backend:

volumes:
  pgdata:
  promdata:
  lokidata:
  grafanadata:
