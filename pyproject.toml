[project]
name = "opspilot"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps", "mcp", "workloads", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "S104",  # allow binding to 0.0.0.0
    "N818",  # allow custom exception names without Error suffix
    "SIM117",  # nested async context managers read better than one long `with`
]

[tool.ruff.lint.per-file-ignores]
# Tests use fixed fake secrets and seeded (non-crypto) randomness on purpose.
"**/tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app", "opsmcp", "opsdemo", "workload_testing", "mcp_fakes", "demo", "run_tests"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "workloads/tests", "mcp/tests", "tests"]
pythonpath = ["apps/api", "workloads", "workloads/tests", "mcp", "mcp/tests", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# System/evaluation tests need a running stack or LLM; run them explicitly with -m.
addopts = "--strict-markers -m 'not system and not evaluation'"
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (require DB/services)",
    "system: System / E2E tests (require full stack)",
    "evaluation: Agent evaluation tests",
]

[tool.coverage.run]
# make coverage / python scripts/run_tests.py coverage (unit + integration)
source = ["apps/api/app", "mcp/opsmcp", "workloads/opsdemo", "scripts"]
branch = true
omit = ["*/migrations/versions/*"]

[tool.coverage.report]
show_missing = false
precision = 1
exclude_also = ['if __name__ == .__main__.:', 'raise AssertionError\("unreachable"\)']
