# Prometheus scrape configuration for OpsPilot
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "opspilot-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "opspilot-mcp"
    static_configs:
      - targets: ["mcp:8001"]
    metrics_path: /metrics

  - job_name: "checkout"
    static_configs:
      - targets: ["checkout:8080"]
    metrics_path: /metrics

  - job_name: "payments"
    static_configs:
      - targets: ["payments:8081"]
    metrics_path: /metrics

  - job_name: "users"
    static_configs:
      - targets: ["users:8082"]
    metrics_path: /metrics
