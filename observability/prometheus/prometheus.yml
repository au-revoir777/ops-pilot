# Prometheus scrape configuration for OpsPilot (local Compose stack).
# Every application target exposes the same HTTP metric names and a bounded
# `service` label, so one set of queries and dashboards covers all of them.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: opspilot-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: workloads
    static_configs:
      - targets: ["checkout:8080", "payments:8081", "users:8082"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # The MCP server is added in Phase 5, when it gains a /metrics endpoint.
