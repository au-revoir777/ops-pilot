# Prometheus scrape configuration for OpsPilot (local Compose stack).
# Every application target exposes the same HTTP metric names and a bounded
# `service` label, so one set of queries and dashboards covers all of them.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: opspilot-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          project: opspilot
          environment: local

  # Every monitored service, demo or external, comes from a target file in
  # ./targets (see external-project.yml.example). No service names live here.
  - job_name: services
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
        refresh_interval: 30s

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: opspilot-mcp
    static_configs:
      - targets: ["mcp:8001"]
        labels:
          project: opspilot
          environment: local
