apiVersion: 1

# Fixed UIDs so dashboards can reference data sources deterministically.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
