# =============================================================================
# OpsPilot CI Pipeline
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt -r workloads/requirements.txt
      - name: Run unit tests
        run: pytest -m unit -v --tb=short
        working-directory: .

  # ---------------------------------------------------------------------------
  # Integration Tests
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    # Same image and database layout as the local `postgres-test` Compose service.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: opspilot_test
          POSTGRES_PASSWORD: opspilot_test
          POSTGRES_DB: opspilot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opspilot_test -d opspilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://opspilot_test:opspilot_test@127.0.0.1:5433/opspilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://opspilot_test:opspilot_test@127.0.0.1:5433/opspilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt -r workloads/requirements.txt
      - name: Migration round-trip (upgrade, downgrade, re-upgrade)
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run integration tests
        run: pytest -m integration -v --tb=short

  # ---------------------------------------------------------------------------
  # Observability config (Prometheus config + rules, Alloy syntax)
  # ---------------------------------------------------------------------------
  observability-config:
    name: Observability Config
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config and rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v2.54.0 check config /etc/prometheus/prometheus.yml
      - name: alloy config syntax
        run: >-
          docker run --rm --entrypoint alloy
          -v "$PWD/observability/alloy:/etc/alloy:ro"
          grafana/alloy:v1.5.1 fmt /etc/alloy/config.alloy

  # ---------------------------------------------------------------------------
  # Build Docker Images
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, observability-config]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t opspilot-api:ci ./apps/api
      - name: Build MCP image
        run: docker build -t opspilot-mcp:ci ./mcp
      - name: Build workloads image (checkout, payments, users)
        run: docker build -t opspilot-workloads:ci ./workloads

  # ---------------------------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build API for scanning
        run: docker build -t opspilot-api:scan ./apps/api
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "opspilot-api:scan"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # ---------------------------------------------------------------------------
  # Terraform Validate
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infra/terraform
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform
