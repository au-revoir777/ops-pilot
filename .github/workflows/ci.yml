# =============================================================================
# OpsPilot CI Pipeline
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Run unit tests
        run: pytest -m unit -v --tb=short
        working-directory: .

  # ---------------------------------------------------------------------------
  # Build Docker Images
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t opspilot-api:ci ./apps/api
      - name: Build MCP image
        run: docker build -t opspilot-mcp:ci ./mcp
      - name: Build Checkout image
        run: docker build -t opspilot-checkout:ci ./workloads/checkout
      - name: Build Payments image
        run: docker build -t opspilot-payments:ci ./workloads/payments
      - name: Build Users image
        run: docker build -t opspilot-users:ci ./workloads/users

  # ---------------------------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build API for scanning
        run: docker build -t opspilot-api:scan ./apps/api
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "opspilot-api:scan"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # ---------------------------------------------------------------------------
  # Terraform Validate
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infra/terraform
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform
